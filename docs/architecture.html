<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Traceable Deep Agents Sample Architecture</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fa;
      --ink: #1f2933;
      --muted: #5b6775;
      --line: #6f7c8d;
      --client: #f3edf9;
      --runtime: #e8f1ff;
      --mesh: #edf7f4;
      --light: #fff4db;
      --deep: #f7e9ee;
      --store: #eaf4ff;
      --note: #fff7e6;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 32px 20px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      letter-spacing: 0;
    }
    p {
      margin: 0 0 20px;
      color: var(--muted);
      line-height: 1.6;
    }
    svg {
      width: 100%;
      height: auto;
      background: #fff;
      border: 1px solid #d8dee7;
    }
    .box { rx: 9; stroke: #96a1af; stroke-width: 1.4; }
    .client { fill: var(--client); }
    .runtime { fill: var(--runtime); }
    .mesh { fill: var(--mesh); }
    .light { fill: var(--light); }
    .deep { fill: var(--deep); }
    .store { fill: var(--store); }
    .note { fill: var(--note); }
    .label {
      font-size: 15px;
      font-weight: 700;
      fill: var(--ink);
    }
    .small {
      font-size: 12px;
      fill: var(--muted);
    }
    .lane {
      font-size: 13px;
      font-weight: 700;
      fill: #3f4b5a;
    }
    .arrow {
      stroke: var(--line);
      stroke-width: 2;
      fill: none;
      marker-end: url(#arrow);
    }
    .soft {
      stroke-dasharray: 6 5;
    }
  </style>
</head>
<body>
<main>
  <h1>Traceable Deep Agents Sample Architecture</h1>
  <p>Runtime owns the public API, trace store, replay, and AgentOps surfaces. The sample owns scoped Tech Radar execution and routes each request to light deterministic tools or the Deep Agents LLM path.</p>
  <svg viewBox="0 0 1120 780" role="img" aria-labelledby="title desc">
    <title id="title">Traceable Deep Agents Sample Architecture</title>
    <desc id="desc">Architecture showing idounAIChat and AgentOps calling traceable-agent-runtime, which delegates tech-radar runs to a sample adapter. The sample builds ContextMesh, classifies complexity, resolves skill and tool bindings, then uses either a deterministic light path or a Deep Agents LLM path with TechNews tools and trace callbacks.</desc>
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#6f7c8d"></path>
      </marker>
    </defs>

    <text x="42" y="42" class="lane">Clients</text>
    <text x="282" y="42" class="lane">Traceable Runtime</text>
    <text x="545" y="42" class="lane">Sample Adapter</text>
    <text x="846" y="42" class="lane">Execution Paths</text>
    <text x="984" y="42" class="lane">Sources</text>

    <rect x="32" y="70" width="200" height="88" class="box client"></rect>
    <text x="54" y="104" class="label">idounAIChat</text>
    <text x="54" y="128" class="small">Agent Server Mode</text>
    <text x="54" y="148" class="small">thin chat and trace viewer</text>

    <rect x="32" y="192" width="200" height="100" class="box client"></rect>
    <text x="54" y="228" class="label">AgentOps Workbench</text>
    <text x="54" y="252" class="small">Run Inspector</text>
    <text x="54" y="272" class="small">Route / Model Path / Tool Mode</text>

    <rect x="282" y="70" width="215" height="96" class="box runtime"></rect>
    <text x="304" y="106" class="label">Agent Server API</text>
    <text x="304" y="130" class="small">/v1/runs, /v1/agents</text>
    <text x="304" y="150" class="small">tech-radar external_adapter</text>

    <rect x="282" y="204" width="215" height="106" class="box runtime"></rect>
    <text x="304" y="238" class="label">Runtime Store</text>
    <text x="304" y="262" class="small">imported trace steps</text>
    <text x="304" y="282" class="small">snapshots, replay, eval, diff</text>

    <rect x="545" y="70" width="230" height="94" class="box mesh"></rect>
    <text x="567" y="104" class="label">Runtime Adapter</text>
    <text x="567" y="128" class="small">ContextMesh identity</text>
    <text x="567" y="148" class="small">tenant / workspace / user</text>

    <rect x="545" y="202" width="230" height="112" class="box mesh"></rect>
    <text x="567" y="236" class="label">Route and Scope</text>
    <text x="567" y="260" class="small">ComplexityRouter</text>
    <text x="567" y="280" class="small">SkillRegistry</text>
    <text x="567" y="300" class="small">tenant-aware ToolBinding</text>

    <rect x="830" y="72" width="230" height="116" class="box light"></rect>
    <text x="852" y="108" class="label">Light Path</text>
    <text x="852" y="132" class="small">deterministic TechNews plan</text>
    <text x="852" y="152" class="small">single-step lookup</text>
    <text x="852" y="172" class="small">default fallback for disabled deep</text>

    <rect x="830" y="226" width="230" height="136" class="box deep"></rect>
    <text x="852" y="262" class="label">Deep Agents Path</text>
    <text x="852" y="286" class="small">TECH_RADAR_DEEP_PATH_ENABLED</text>
    <text x="852" y="306" class="small">Gemini/OpenAI model provider</text>
    <text x="852" y="326" class="small">deep_model_* / deep_tool_* trace</text>
    <text x="852" y="346" class="small">retry final synthesis if tool-only</text>

    <rect x="830" y="402" width="230" height="96" class="box store"></rect>
    <text x="852" y="438" class="label">TechNews Read APIs</text>
    <text x="852" y="462" class="small">search_tech_news</text>
    <text x="852" y="482" class="small">latest / article detail</text>

    <rect x="545" y="402" width="230" height="96" class="box runtime"></rect>
    <text x="567" y="438" class="label">Tool Replay Contract</text>
    <text x="567" y="462" class="small">live: call tool/API again</text>
    <text x="567" y="482" class="small">frozen: reuse recorded tool result</text>

    <rect x="282" y="408" width="215" height="90" class="box runtime"></rect>
    <text x="304" y="442" class="label">Trace Contract</text>
    <text x="304" y="466" class="small">context_mesh_built</text>
    <text x="304" y="486" class="small">complexity_classified / route_selected</text>

    <rect x="32" y="560" width="1028" height="112" class="box note"></rect>
    <text x="54" y="596" class="label">Stable Boundaries</text>
    <text x="54" y="622" class="small">Clients call runtime, not the sample directly. The runtime imports sample traces so Workbench, replay, eval, and diff stay on the runtime API.</text>
    <text x="54" y="646" class="small">Replay currently controls tool results, not model output. Deep execution remains feature-flagged until default-on, tenant-gated, or agent-policy-gated behavior is decided.</text>

    <path class="arrow" d="M232 114 H282"></path>
    <path class="arrow" d="M232 244 H282"></path>
    <path class="arrow" d="M497 118 H545"></path>
    <path class="arrow" d="M660 164 V202"></path>
    <path class="arrow" d="M775 244 C800 202 810 148 830 132"></path>
    <path class="arrow" d="M775 278 C802 282 808 292 830 294"></path>
    <path class="arrow" d="M945 188 V226"></path>
    <path class="arrow" d="M945 362 V402"></path>
    <path class="arrow" d="M830 450 H775"></path>
    <path class="arrow soft" d="M545 450 H497"></path>
    <path class="arrow soft" d="M390 310 V408"></path>
    <path class="arrow soft" d="M545 118 C520 182 520 252 497 258"></path>
    <path class="arrow" d="M660 314 V402"></path>
    <path class="arrow soft" d="M132 292 C132 518 548 520 548 560"></path>
  </svg>
</main>
</body>
</html>
