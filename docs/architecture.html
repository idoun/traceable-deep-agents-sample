<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Traceable Deep Agents Sample Architecture</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fa;
      --ink: #1f2933;
      --muted: #5b6775;
      --line: #7a8697;
      --runtime: #e8f1ff;
      --sample: #e9f8ef;
      --store: #fff4db;
      --external: #f3edf9;
      --risk: #ffe9e5;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 32px 20px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      letter-spacing: 0;
    }
    p {
      margin: 0 0 20px;
      color: var(--muted);
      line-height: 1.6;
    }
    svg {
      width: 100%;
      height: auto;
      background: #fff;
      border: 1px solid #d8dee7;
    }
    .label {
      font-size: 15px;
      font-weight: 700;
      fill: var(--ink);
    }
    .small {
      font-size: 12px;
      fill: var(--muted);
    }
    .lane {
      font-size: 13px;
      font-weight: 700;
      fill: #3f4b5a;
    }
  </style>
</head>
<body>
<main>
  <h1>Traceable Deep Agents Sample Architecture</h1>
  <p>Runtime owns the public Agent Server API and trace store. The sample owns the Tech Radar tool behavior and talks to TechNews read APIs.</p>
  <svg viewBox="0 0 1080 720" role="img" aria-labelledby="title desc">
    <title id="title">Traceable Deep Agents Sample Architecture</title>
    <desc id="desc">Architecture showing idounAIChat and Workbench calling traceable-agent-runtime, which delegates tech-radar runs to traceable-deep-agents-sample, which reads technews-publisher data and returns traces.</desc>
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#7a8697"></path>
      </marker>
      <style>
        .box { rx: 10; stroke: #96a1af; stroke-width: 1.4; }
        .runtime { fill: var(--runtime); }
        .sample { fill: var(--sample); }
        .store { fill: var(--store); }
        .external { fill: var(--external); }
        .risk { fill: var(--risk); }
        .arrow { stroke: var(--line); stroke-width: 2; fill: none; marker-end: url(#arrow); }
        .soft { stroke-dasharray: 6 5; }
      </style>
    </defs>

    <text x="56" y="42" class="lane">Clients</text>
    <text x="336" y="42" class="lane">Traceable Runtime</text>
    <text x="640" y="42" class="lane">External Agent</text>
    <text x="880" y="42" class="lane">Knowledge Source</text>

    <rect x="36" y="72" width="220" height="94" class="box external"></rect>
    <text x="58" y="108" class="label">idounAIChat</text>
    <text x="58" y="132" class="small">Agent Server Mode</text>
    <text x="58" y="152" class="small">session_id: conversation id</text>

    <rect x="36" y="206" width="220" height="94" class="box external"></rect>
    <text x="58" y="242" class="label">AgentOps Workbench</text>
    <text x="58" y="266" class="small">Run Inspector</text>
    <text x="58" y="286" class="small">Replay / Batch / Suites</text>

    <rect x="330" y="72" width="250" height="104" class="box runtime"></rect>
    <text x="354" y="108" class="label">traceable-agent-runtime</text>
    <text x="354" y="132" class="small">/v1/runs, /v1/agents</text>
    <text x="354" y="152" class="small">manifest, policy, replay</text>

    <rect x="330" y="216" width="250" height="94" class="box runtime"></rect>
    <text x="354" y="252" class="label">Trace Store</text>
    <text x="354" y="276" class="small">runs, steps, snapshots</text>
    <text x="354" y="296" class="small">eval and diff inputs</text>

    <rect x="640" y="72" width="240" height="104" class="box sample"></rect>
    <text x="664" y="108" class="label">Deep Agents Sample</text>
    <text x="664" y="132" class="small">/v1/runs, /v1/agents</text>
    <text x="664" y="152" class="small">Tech Radar adapter</text>

    <rect x="640" y="216" width="240" height="122" class="box sample"></rect>
    <text x="664" y="252" class="label">Read-only Tools</text>
    <text x="664" y="276" class="small">search_tech_news</text>
    <text x="664" y="296" class="small">get_latest_tech_news</text>
    <text x="664" y="316" class="small">get_tech_news_article</text>

    <rect x="900" y="206" width="150" height="118" class="box store"></rect>
    <text x="920" y="242" class="label">TechNews API</text>
    <text x="920" y="266" class="small">latest</text>
    <text x="920" y="286" class="small">search</text>
    <text x="920" y="306" class="small">article detail</text>

    <rect x="900" y="374" width="150" height="104" class="box store"></rect>
    <text x="920" y="410" class="label">Daily Digest</text>
    <text x="920" y="434" class="small">morning KST</text>
    <text x="920" y="454" class="small">previous day</text>

    <rect x="330" y="374" width="250" height="114" class="box runtime"></rect>
    <text x="354" y="410" class="label">Replay Contract</text>
    <text x="354" y="434" class="small">RunCreateRequest.replay</text>
    <text x="354" y="454" class="small">live or frozen</text>
    <text x="354" y="474" class="small">capability cache</text>

    <rect x="640" y="398" width="240" height="90" class="box sample"></rect>
    <text x="664" y="434" class="label">Frozen Tool Result</text>
    <text x="664" y="458" class="small">reuse matching output</text>
    <text x="664" y="478" class="small">skip live tool call</text>

    <rect x="36" y="560" width="1014" height="92" class="box risk"></rect>
    <text x="58" y="594" class="label">Freshness Rule</text>
    <text x="58" y="620" class="small">For “today's news” requests, answer from the latest collected issue and say today's collection may not be available yet.</text>

    <path class="arrow" d="M256 118 H330"></path>
    <path class="arrow" d="M256 252 H330"></path>
    <path class="arrow" d="M580 124 H640"></path>
    <path class="arrow" d="M760 176 V216"></path>
    <path class="arrow" d="M880 276 H900"></path>
    <path class="arrow" d="M975 374 V324"></path>
    <path class="arrow" d="M640 136 C605 158 606 225 580 252"></path>
    <path class="arrow soft" d="M455 310 V374"></path>
    <path class="arrow soft" d="M580 430 H640"></path>
    <path class="arrow soft" d="M760 398 V338"></path>
    <path class="arrow" d="M455 176 V216"></path>
    <path class="arrow" d="M760 338 C760 514 142 514 142 560"></path>
  </svg>
</main>
</body>
</html>
